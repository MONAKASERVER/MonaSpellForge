schema-version: 1
fragment-policy: EXCLUSIVE_ACTIVE_CIRCUIT
database:
  file: monaspellforge.sqlite
security:
  hmac-secret: ''
  max-give-amount: 64
runtime:
  max-nodes: 25
  max-edges: 64
  max-runtime-cost: 512
  max-range: 64.0
  max-duration-seconds: 30
  max-projectiles-per-player: 32
  repeat-limit: 8
  minimum-tps: 17.0
  mana-capacity: 1000.0
  mana-regeneration-per-second: 10.0
arc-runtime:
  max-active-tasks: 1024
  max-resumes-per-tick: 128
  max-damage-per-effect: 200.0
  max-target-range: 64.0
  max-potion-duration-ticks: 600
  max-display-duration-ticks: 200
  # ArcSysからSkriptへ送れるイベント名。空なら完全無効。
  skript-allowlist: []
  contract:
    max-effects-per-segment: 64
    max-displays-per-segment: 8
    max-pdc-writes-per-segment: 8
    max-skript-signals-per-segment: 4
arcsys:
  core:
    enabled: false
    allow-production-effects: false
    require-owner: true
    prevent-cross-player-binding: true
    max-level: 5
    max-active-executions-per-player: 2
    max-active-executions-global: 64
    max-effects-per-tick: 64
    default-binding-mode: PINNED
    log-executions: true
    minimum-tps: 17.0
    levels:
      1: {fuel: 64, max-effects: 2, mana: 40, cooldown-ticks: 80, static-load: 12}
      2: {fuel: 96, max-effects: 3, mana: 55, cooldown-ticks: 70, static-load: 16}
      3: {fuel: 128, max-effects: 4, mana: 75, cooldown-ticks: 60, static-load: 24}
      4: {fuel: 192, max-effects: 6, mana: 100, cooldown-ticks: 50, static-load: 32}
      5: {fuel: 256, max-effects: 8, mana: 130, cooldown-ticks: 40, static-load: 40}
particles:
  enabled: true
  # 1回の実行に許可する最大粒子数。反復・周期実行では実行ごとに適用。
  max-per-cast: 180
  # TPS低下時は演出だけを縮小し、攻撃・効果判定には影響させない。
  degraded-below-tps: 18.0
  degraded-multiplier: 0.4
equipment-mana:
  enabled: true
  # 防具4枠・メインハンド・オフハンドの青色Lore「MP: 数値」「MPS: 数値」を加算。
  maximum-mp-bonus: 100000.0
  maximum-mps-bonus: 10000.0
editor:
  session-timeout-seconds: 900
  max-packets-per-second: 20
  max-packet-bytes: 30000
web-editor:
  enabled: true
  api-base: https://www.monacraft.net
  public-url: https://node.monacraft.net/
  server-secret: ''
hud:
  enabled: true
  update-interval-ticks: 10
  vanilla-health-scale: 20.0
upgrades:
  enabled: true
  failure-keeps-level: true
  pity-enabled: false
integrations:
  vault: true
  mythicmobs: true
  floodgate: true
  worldguard: true
