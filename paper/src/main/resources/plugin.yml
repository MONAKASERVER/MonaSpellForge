name: MonaSpellForge
version: '${version}'
main: net.monacraft.spellforge.paper.MonaSpellForgePlugin
api-version: '1.21.11'
authors: [MONAKA SERVER]
description: 上級者向け魔術回路構築・強化・実行システム
softdepend: [Vault, MythicMobs, floodgate, WorldGuard, Skript]
commands:
  msf:
    description: MonaSpellForge
    usage: /msf [open|web|spell|stone|fragment|reload|debug|admin]
    permission: monaspellforge.use
permissions:
  monaspellforge.use: {default: true}
  monaspellforge.cast: {default: true}
  monaspellforge.admin.fragment.give: {default: op}
  monaspellforge.admin.stone.give: {default: op}
  monaspellforge.admin.reload: {default: op}
  monaspellforge.admin.audit: {default: op}
  monaspellforge.admin.stopcasts: {default: op}
  monaspellforge.arcsys.use: {default: true}
  monaspellforge.arcsys.cast: {default: true}
  monaspellforge.arcsys.vscode: {default: true}
  monaspellforge.arcsys.debug: {default: op}
  monaspellforge.arcsys.deploy: {default: true}
  monaspellforge.arcsys.operator: {default: op}
  monaspellforge.arcsys.signal: {default: op}
  monaspellforge.arcsys.core.use: {default: true}
  monaspellforge.arcsys.core.bind: {default: true}
  monaspellforge.arcsys.core.admin: {default: op}
